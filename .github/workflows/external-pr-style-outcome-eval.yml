name: External PR style outcome eval

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Repository-controlled target-agent executable path
        default: eval/engineering/external-pr-style/targets/reference-external-pr-style-agent.py
        type: string
      image:
        description: Digest-pinned evaluator image
        default: python:3.12-alpine@sha256:aa679aa4eed6eb56c1dc6ad3f1b98b7d2d788fd961596779d188fdedad97fb38
        type: string
      model:
        description: Declared model identifier
        default: reference-external-pr-style-agent-v1
        type: string

jobs:
  outcome-eval:
    environment: outcome-evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run isolated enabled and disabled trials
        env:
          AGENT: ${{ inputs.agent }}
          IMAGE: ${{ inputs.image }}
          MODEL: ${{ inputs.model }}
        run: >-
          python3 eval/engineering/external-pr-style/run_harness.py
          --agent "$AGENT" --image "$IMAGE"
          --model "$MODEL" --trials 5
          --output external-pr-style-outcome-results.json
      - name: Validate outcome delta and safety threshold
        run: >-
          python3 eval/engineering/external-pr-style/validate-harness-results.py
          --results external-pr-style-outcome-results.json --trials 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: external-pr-style-outcome-results
          path: external-pr-style-outcome-results.json
          retention-days: 90
