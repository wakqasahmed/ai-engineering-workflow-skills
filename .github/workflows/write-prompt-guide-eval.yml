name: Write prompt guide evaluation

on:
  pull_request:
    paths:
      - 'skills/engineering/write-prompt-guide/**'
      - 'eval/engineering/write-prompt-guide/**'
      - 'SOURCES.md'
      - '.github/workflows/write-prompt-guide-eval.yml'

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run offline deterministic contract checks
        run: bash eval/engineering/write-prompt-guide/run-eval.sh --dry-run
