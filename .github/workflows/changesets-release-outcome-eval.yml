name: Changesets release outcome eval

on:
  workflow_dispatch:
    inputs:
      command:
        description: Evaluator command run inside the isolated image; emit one JSON record to stdout
        required: true
        type: string
      image:
        description: Digest-pinned evaluator image
        required: true
        type: string
      model:
        description: Declared model identifier
        required: true
        type: string

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run isolated enabled and disabled trials
        shell: bash
        run: >-
          python3 eval/engineering/changesets-release/run_harness.py
          --command "${{ inputs.command }}"
          --image "${{ inputs.image }}"
          --model "${{ inputs.model }}"
          --trials 5
          --output changesets-release-outcomes.json
      - name: Compare held-out outcomes
        shell: bash
        run: >-
          python3 eval/engineering/changesets-release/validate-harness-results.py
          changesets-release-outcomes.json
          --summary changesets-release-summary.json
      - name: Retain outcome comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: changesets-release-outcome-eval
          path: |
            changesets-release-outcomes.json
            changesets-release-summary.json
