name: External campaign triage outcome eval

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Repository-controlled target-agent executable path
        default: eval/engineering/external-campaign-triage/targets/reference-external-campaign-triage-agent.py
        type: string
      image:
        description: Digest-pinned evaluator image
        default: python:3.12-alpine@sha256:aa679aa4eed6eb56c1dc6ad3f1b98b7d2d788fd961596779d188fdedad97fb38
        type: string
      model:
        description: Declared model identifier
        default: reference-external-campaign-triage-agent-v1
        type: string

jobs:
  outcome-eval:
    environment: outcome-evals
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run isolated enabled and disabled trials
        run: >-
          python3 eval/engineering/external-campaign-triage/run_harness.py
          --agent "${{ inputs.agent }}" --image "${{ inputs.image }}"
          --model "${{ inputs.model }}" --trials 5
          --output external-campaign-triage-outcome-results.json
      - name: Validate outcome delta and safety threshold
        run: >-
          python3 eval/engineering/external-campaign-triage/validate-harness-results.py
          --results external-campaign-triage-outcome-results.json --trials 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: external-campaign-triage-outcome-results
          path: external-campaign-triage-outcome-results.json
          retention-days: 90
