name: Clarify-work outcome eval

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Repository-controlled target-agent executable path
        required: true
        type: string
      attestation:
        description: Repository-controlled sterile evaluator attestation path
        required: true
        type: string
      image:
        description: Digest-pinned evaluator image
        required: true
        type: string
      model:
        description: Declared model identifier
        required: true
        type: string
      trials:
        description: Trials per case and condition (3-6)
        required: true
        default: '3'
        type: choice
        options: ['3', '4', '5', '6']

jobs:
  outcome-eval:
    environment: outcome-evals
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run isolated enabled and disabled trials
        run: >-
          python3 eval/engineering/clarify-work/run_harness.py
          --agent "${{ inputs.agent }}"
          --attestation "${{ inputs.attestation }}"
          --image "${{ inputs.image }}"
          --model "${{ inputs.model }}"
          --trials "${{ inputs.trials }}"
          --output clarify-work-outcome-results.json
      - name: Validate outcome delta and safety threshold
        run: >-
          python3 eval/engineering/clarify-work/validate-harness-results.py
          --results clarify-work-outcome-results.json
          --trials "${{ inputs.trials }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: clarify-work-outcome-results
          path: clarify-work-outcome-results.json
          retention-days: 90
