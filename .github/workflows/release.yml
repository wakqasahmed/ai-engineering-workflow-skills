name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: npm ci
      # Nothing is published to a registry: this pack is installed straight from
      # the repository with `npx skills add`. The action only opens/updates the
      # version PR, and the version step regenerates the README diagram so it
      # ships with the same commit as the version bump.
      #
      # changesets/action runs `version` via @actions/exec with no shell, so it
      # tokenizes the string itself and `&&` is passed through literally instead
      # of being interpreted as a shell operator. The chain has to live behind a
      # single npm script (npm run *does* go through a shell) rather than inline
      # here.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npm run version-packages
          title: "Version Packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
