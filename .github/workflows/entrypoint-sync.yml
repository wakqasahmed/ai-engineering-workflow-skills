name: Entrypoint sync

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  entrypoint-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify AGENTS.md and CLAUDE.md stay aligned
        shell: bash
        run: diff -u <(sed '3d' AGENTS.md) <(sed '3d' CLAUDE.md)
      - name: Verify user installer
        shell: bash
        run: scripts/test-install-user.sh
      - name: Verify skill listing
        shell: bash
        run: scripts/list-skills.sh | grep -q "skills/engineering/clarify-work/SKILL.md"
      - name: Run open-code-review-setup deterministic contract eval
        shell: bash
        run: eval/engineering/open-code-review-setup/run-eval.sh
      - name: Verify plugin skill paths
        shell: bash
        run: python3 scripts/validate-plugin.py
      - name: Verify Git guardrails
        shell: bash
        run: scripts/test-git-guardrails.sh
      - name: Verify Changesets release skill
        shell: bash
        run: scripts/test-changesets-release.sh
      - name: Run Changesets release deterministic eval
        shell: bash
        run: eval/engineering/changesets-release/run-eval.sh --dry-run
      - name: Verify Changesets release outcome validator
        shell: bash
        run: python3 eval/engineering/changesets-release/test-validator.py
      - name: Run subagent-pipeline behavioral eval
        shell: bash
        run: eval/engineering/subagent-pipeline/run-eval.sh --dry-run
      - name: Run workflow-router deterministic contract eval
        shell: bash
        run: eval/engineering/workflow-router/run-eval.sh
      - name: Run clarify-work deterministic contract eval
        shell: bash
        run: eval/engineering/clarify-work/run-eval.sh --dry-run
      - name: Run wizard deterministic contract eval
        shell: bash
        run: eval/engineering/wizard/run-eval.sh
      - name: Run release-gate deterministic contract eval
        shell: bash
        run: eval/engineering/release-gate/run-eval.sh --dry-run
      - name: Verify release-gate outcome validator
        shell: bash
        run: python3 -m unittest eval/engineering/release-gate/test_harness.py
      - name: Run HITL blocker deterministic contract eval
        shell: bash
        run: eval/engineering/hitl-blocker/run-eval.sh --dry-run
      - name: Verify HITL blocker outcome validator
        shell: bash
        run: python3 -m unittest eval/engineering/hitl-blocker/test_harness.py
      - name: Run external PR viability deterministic contract eval
        shell: bash
        run: eval/engineering/external-pr-viability/run-eval.sh --dry-run
      - name: Verify external PR viability outcome validator
        shell: bash
        run: python3 -m unittest eval/engineering/external-pr-viability/test_harness.py
      - name: Run external campaign triage deterministic contract eval
        shell: bash
        run: eval/engineering/external-campaign-triage/run-eval.sh --dry-run
      - name: Verify external campaign triage outcome validator
        shell: bash
        run: python3 -m unittest eval/engineering/external-campaign-triage/test_harness.py
      - name: Run review-gate deterministic contract eval
        shell: bash
        run: eval/engineering/review-gate/run-eval.sh --dry-run
      - name: Run decompose-to-issues deterministic contract eval
        shell: bash
        run: eval/engineering/decompose-to-issues/run-eval.sh --dry-run
      - name: Verify decompose-to-issues outcome validator
        shell: bash
        run: python3 -m unittest eval/engineering/decompose-to-issues/test_harness.py
      - name: Run to-prd deterministic contract eval
        shell: bash
        run: eval/engineering/to-prd/run-eval.sh --dry-run
      - name: Verify to-prd outcome validator
        shell: bash
        run: python3 -m unittest eval/engineering/to-prd/test_harness.py
      - name: Run define-done deterministic contract eval
        shell: bash
        run: eval/engineering/define-done/run-eval.sh --dry-run
      - name: Verify define-done outcome validator
        shell: bash
        run: python3 -m unittest eval/engineering/define-done/test_harness.py
      - name: Run handover deterministic contract eval
        shell: bash
        run: eval/productivity/handover/run-eval.sh --dry-run
      - name: Verify handover outcome validator
        shell: bash
        run: python3 -m unittest eval/productivity/handover/test_harness.py
      - name: Run roast deterministic contract eval
        shell: bash
        run: eval/product/roast/run-eval.sh --dry-run
      - name: Verify roast outcome validator
        shell: bash
        run: python3 -m unittest eval/product/roast/test_harness.py
      - name: Verify PR governance verifier
        shell: bash
        run: python3 -m unittest support/ai-engineering-workflow/tests/test_verify_pr_governance.py
