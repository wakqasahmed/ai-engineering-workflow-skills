name: Entrypoint sync

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  entrypoint-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify AGENTS.md and CLAUDE.md stay aligned
        shell: bash
        run: diff -u <(sed '3d' AGENTS.md) <(sed '3d' CLAUDE.md)
      - name: Verify user installer
        shell: bash
        run: scripts/test-install-user.sh
      - name: Verify skill listing
        shell: bash
        run: scripts/list-skills.sh | grep -q "skills/engineering/clarify-work/SKILL.md"
      - name: Verify plugin skill paths
        shell: bash
        run: python3 scripts/validate-plugin.py
      - name: Verify Changesets release skill
        shell: bash
        run: scripts/test-changesets-release.sh
      - name: Run Changesets release deterministic eval
        shell: bash
        run: eval/engineering/changesets-release/run-eval.sh --dry-run
      - name: Verify Changesets release outcome validator
        shell: bash
        run: python3 eval/engineering/changesets-release/test-validator.py
      - name: Run subagent-pipeline behavioral eval
        shell: bash
        run: eval/engineering/subagent-pipeline/run-eval.sh --dry-run
      - name: Run clarify-work deterministic contract eval
        shell: bash
        run: eval/engineering/clarify-work/run-eval.sh --dry-run
      - name: Run release-gate deterministic contract eval
        shell: bash
        run: eval/engineering/release-gate/run-eval.sh --dry-run
      - name: Verify release-gate outcome validator
        shell: bash
        run: python3 -m unittest eval/engineering/release-gate/test_harness.py
      - name: Run review-gate deterministic contract eval
        shell: bash
        run: eval/engineering/review-gate/run-eval.sh --dry-run
      - name: Run decompose-to-issues deterministic contract eval
        shell: bash
        run: eval/engineering/decompose-to-issues/run-eval.sh --dry-run
      - name: Verify decompose-to-issues outcome validator
        shell: bash
        run: python3 -m unittest eval/engineering/decompose-to-issues/test_harness.py
      - name: Run to-prd behavioral eval
        shell: bash
        run: eval/engineering/to-prd/run-eval.sh
